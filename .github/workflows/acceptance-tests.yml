name: Acceptance tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  airplane-mode-harness:
    name: AT-0-1 airplane mode harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify network namespace has no WAN access (AT-0-1 placeholder)
        run: |
          set -euo pipefail
          echo "Proving the isolated-namespace harness itself has no WAN access."
          sudo ip netns add nex-airplane-mode
          sudo ip netns exec nex-airplane-mode ip link set lo up

          if sudo ip netns exec nex-airplane-mode timeout 3 sh -c 'cat < /dev/null > /dev/tcp/1.1.1.1/443' 2>/dev/null; then
            echo "FAIL: outbound connection succeeded inside the airplane-mode namespace" >&2
            exit 1
          fi
          echo "PASS: no outbound WAN access inside the airplane-mode namespace"
          sudo ip netns delete nex-airplane-mode

      - name: Note
        run: |
          echo "This job proves the harness only. The real hub-process test"
          echo "(docs/ACCEPTANCE-TESTS.md AT-0-1 / AT-2-2) now exists — see the"
          echo "hub-stack job below."

  sync-protocol:
    name: AT-1-1..3 CRDT sync prototype (Phase 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: sync-protocol
        run: npm ci

      - name: Run Phase 1 sync protocol test matrix
        working-directory: sync-protocol
        run: npm test

  wireguard-transport:
    name: AT-1-1..3 over a real WireGuard tunnel (Phase 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install dependencies
        working-directory: sync-protocol
        run: npm ci

      - name: Install WireGuard tooling
        run: sudo apt-get update -qq && sudo apt-get install -y iproute2 wireguard-tools

      - name: Build wireguard-go (userspace — GitHub Actions runners have no kernel WireGuard module)
        run: |
          git clone --depth 1 https://github.com/WireGuard/wireguard-go.git /tmp/wireguard-go
          cd /tmp/wireguard-go
          go build -o /usr/local/bin/wireguard-go .

      - name: Run the real-WireGuard-tunnel demo (AT-1-1, AT-1-2, AT-1-3)
        # sudo resets PATH by default, which would hide the toolchain
        # actions/setup-node and actions/setup-go just added to it.
        run: sudo env PATH="$PATH" infra/wireguard-poc/run-demo.sh

  hub-stack:
    name: AT-2-1, AT-2-2 hub stack (Phase 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/nex-llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('.github/workflows/acceptance-tests.yml') }}

      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential iproute2

      - name: Run the hub stack demo (AT-2-1, AT-2-2)
        # sudo resets PATH; the script builds/finds llama.cpp, a Python
        # venv, and the synthetic model itself (see hub/README.md).
        run: sudo env PATH="$PATH" hub/scripts/hub-stack-demo.sh

  dreaming-pipeline:
    name: AT-3-1 dreaming pipeline (Phase 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/nex-llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('.github/workflows/acceptance-tests.yml') }}

      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Run the dreaming pipeline demo (AT-3-1)
        # No root needed here — no network-namespace check in this one.
        run: hub/scripts/dreaming-demo.sh

  pocket-node:
    name: AT-4-1 pocket node (Phase 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/nex-llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('.github/workflows/acceptance-tests.yml') }}

      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential iproute2

      - name: Run pocket/sync's own unit tests
        working-directory: pocket/sync
        run: gradle test --console=plain

      - name: Run the pocket node demo (AT-4-1)
        # sudo resets PATH; needed for the airplane-mode network namespace.
        run: sudo env PATH="$PATH" pocket/scripts/pocket-demo.sh

  zero-internet:
    name: AT-5-1..3 full integration, load test, security pass (Phase 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/nex-llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('.github/workflows/acceptance-tests.yml') }}

      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential iproute2 wireguard-tools

      - name: Build wireguard-go (userspace — GitHub Actions runners have no kernel WireGuard module)
        run: |
          git clone --depth 1 https://github.com/WireGuard/wireguard-go.git /tmp/wireguard-go
          cd /tmp/wireguard-go
          go build -o /usr/local/bin/wireguard-go .

      - name: Run the full-integration/load-test/security-pass demo (AT-5-1, AT-5-2, AT-5-3)
        # sudo resets PATH; the script needs the toolchains above plus
        # network namespaces, WireGuard, and iptables.
        run: sudo env PATH="$PATH" infra/zero-internet/run-week.sh

  device-identity:
    name: AT-6-1 device identity — TPM sign/verify (Phase 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install swtpm and tpm2-tools
        run: sudo apt-get update -qq && sudo apt-get install -y swtpm tpm2-tools

      - name: Run the TPM identity demo (AT-6-1)
        run: hub/identity/tpm-identity-demo.sh

  sandbox-runtime:
    name: AT-6-2 sandboxed tool runtime — gVisor + Wasmtime (Phase 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gVisor (runsc)
        run: sudo apt-get update -qq && sudo apt-get install -y runsc

      - name: Install Wasmtime
        run: curl https://wasmtime.dev/install.sh -sSf | bash -s -- --to /usr/local/bin

      - name: Set up the hub's file-search app dependencies
        run: |
          python3 -m venv /tmp/nex-hub-venv
          /tmp/nex-hub-venv/bin/pip install -q mcp httpx

      - name: Run the sandbox demo (AT-6-2)
        run: sudo env PATH="$PATH" hub/sandbox/sandbox-demo.sh

  update-mechanism:
    name: AT-6-3 update mechanism — Nix generations/rollback (Phase 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (single-user)
        run: |
          sudo groupadd nixbld
          sudo useradd -M -N -g users -G nixbld nixbld1
          sh <(curl -sSL https://releases.nixos.org/nix/nix-2.24.9/install) --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Run the Nix rollback demo (AT-6-3)
        run: infra/update-mechanism/nix-rollback-demo.sh

  app-distribution:
    name: AT-6-4 app distribution — signed index (Phase 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install fdroidserver
        run: sudo apt-get update -qq && sudo apt-get install -y fdroidserver

      - name: Run the F-Droid repo build/signing demo (AT-6-4)
        run: infra/fdroid-repo/build-repo-demo.sh

  modem-isolation:
    name: AT-6-5 modem/NPU isolation — zero-WAN gate (Phase 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: /tmp/nex-llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('.github/workflows/acceptance-tests.yml') }}

      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential iproute2 wireguard-tools

      - name: Build wireguard-go (userspace — GitHub Actions runners have no kernel WireGuard module)
        run: |
          git clone --depth 1 https://github.com/WireGuard/wireguard-go.git /tmp/wireguard-go
          cd /tmp/wireguard-go
          go build -o /usr/local/bin/wireguard-go .

      - name: Run the modem/NPU isolation gate (AT-6-5) — runs AT-2-2, AT-4-1, AT-5-1 as one check
        # No dedicated no-WAN test of its own: it gates on the three
        # already-real, already-CI-wired tests above that each prove
        # correct operation with zero WAN access — see
        # infra/modem-isolation/README.md for why a fourth test would
        # just duplicate them.
        run: sudo env PATH="$PATH" infra/modem-isolation/isolation-test.sh
